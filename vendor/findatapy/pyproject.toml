[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "findatapy"
version = "0.1.42+ayu1"
description = "findatapy with a narrow Python UTC deprecation compatibility patch"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENCE"]
dependencies = [
    "pandas",
    "twython",
    "pytz",
    "requests",
    "numpy",
    "pandas-datareader",
    "alpha-vantage",
    "eikon",
    "yfinance",
    "quandl",
    "chartpy",
    "statsmodels",
    "multiprocess",
    "redis",
    "numba",
    "pyarrow",
    "keyring",
    "openpyxl"
]

[tool.hatch.build.targets.wheel]
packages = ["src/findatapy"]
