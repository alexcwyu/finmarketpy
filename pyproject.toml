[project]
name = 'finmarketpy'
version = "0.11.19"
description = "finmarketpy is a Python based library for backtesting trading strategies"
authors = [{name='Saeed Amen', email= 'saeed@cuemacro.com'}]
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "plotly>=5.24.1,<6",
    "blosc>=1.11.4",
    "chartpy>=0.1.16",
    "findatapy>=0.1.42",
    "matplotlib>=3.11.2",
    "multiprocess>=0.70.19",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pytz>=2026.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seasonal>=0.3.1",
    "twython>=3.9.1",
]
keywords = [
    "trading", "markets", "currencies", "pandas", "data", "Bloomberg", "tick", "stocks", "equities"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
repository = "https://github.com/cuemacro/finmarketpy"
Homepage = "https://github.com/cuemacro/finmarketpy"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "deptry>=0.25.1",
    "marimo>=0.25.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "*__init__.py"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finmarketpy"]

[tool.hatch.build]
include = [
    "LICENSE",    # Ensure the LICENSE file is included in your package
    "README.md",
    "src/finmarketpy"
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.deptry.per_rule_ignores]
#DEP001 = ["pyfolio"]       # very dated dependency!
DEP003 = ["finmarketpy"]

[tool.uv.sources]
findatapy = {path = "vendor/findatapy"}
chartpy = {path = "vendor/chartpy"}

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "README.md", "src/finmarketpy", "vendor", "pyproject.toml", "uv.lock", ".python-version"]
